<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>POS Cafetería</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>☕ POS Cafetería</header>

<nav class="nav">
  <button onclick="showMenu()">🧾 Ventas</button>
  <button onclick="showInventory()">📦 Inventario</button>
  <button onclick="showSalesHistory()">📊 Historial</button>
  <button onclick="showCorteHoy()">💰 Corte</button>
  <button onclick="showReports()">📊 Reportes</button>
</nav>


<div class="container">

  <!-- VENTAS -->
  <section id="salesView" class="panel">
    <h2>Menú</h2>
    <div id="menu"></div>
  </section>


  <!-- REPORTES -->
  <section id="reportsView" class="panel hidden">
    <h2>📊 Reportes</h2>

    <div>Hoy: $<span id="todayTotal">0</span></div>
    <div>Semana: $<span id="weekTotal">0</span></div>
    <div>Mes: $<span id="monthTotal">0</span></div>
  </section>


  <!-- INVENTARIO -->
  <section id="inventoryView" class="panel hidden">
    <h2>Inventario</h2>

    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody id="inventoryTable"></tbody>
    </table>
  </section>


  <!-- ORDEN -->
  <section id="orderView" class="panel">
    <h2>Orden</h2>

    <div id="order"></div>

    <div class="total">
      Total: <span id="total">$0</span>
    </div>

    <button class="btn cobrar" onclick="checkout()">
      💵 Cobrar
    </button>
  </section>

</div>


<!-- JS (SIN / AL INICIO) -->
<script src="/js/app.js?v=999"></script>

</body>
</html>
